<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="looply-logo-grad" x1="10" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>

  <!-- Brand Mark Icon -->
  <g transform="translate(4, 2)">
    <rect width="56" height="56" rx="14" fill="#0F172A" />
    <path
      d="M18 20 C12 20 8 24 8 28 C8 32 12 36 18 36 C25 36 31 20 38 20 C44 20 48 24 48 28 C48 32 44 36 38 36 C31 36 25 20 18 20 Z"
      stroke="url(#looply-logo-grad)"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <circle cx="18" cy="28" r="2.5" fill="#818CF8" />
    <circle cx="38" cy="28" r="2.5" fill="#F472B6" />
  </g>

  <!-- Typography: Looply -->
  <text x="74" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    Loop<tspan fill="#7C3AED">ly</tspan>
  </text>
  <!-- Tagline: Connect. Share. Express. -->
  <text x="75" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1.2">
    CONNECT. SHARE. EXPRESS.
  </text>
</svg>
